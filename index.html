<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小松堂おみくじガチャ V2</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">
</head>
<body>
    <div class="shop-container">
        <div class="shop-background">
            <img src="https://image.pollinations.ai/prompt/A%20dimly%20lit,%20uncanny%20interior%20photo%20of%20a%20vintage%20Japanese%20candy%20store%20(Dagashiya),%20named%20'Komatsudo'.%20Old%20wooden%20shelves%20and%20counters%20are%20crammed%20with%20traditional%20Japanese%20dagashi%20snacks,%20colorful%20cheap%20candy%20boxes,%20and%20glass%20jars.%20A%20single%20naked%20tungsten%20light%20bulb%20hangs%20from%20the%20wooden%20ceiling,%20casting%20eerie,%20deep%20shadows%20everywhere.%20The%20atmosphere%20is%20mysterious,%20nostalgic,%20and%20slightly%20spooky,%20showing%20the%20entire%20cluttered%20interior." alt="不気味な日本の駄菓子屋店内の背景" class="real-bg-image">
        </div>

        <header class="shop-header">
            <h1 class="shop-title">駄菓子 小松堂</h1>
            <p class="shop-subtitle">〜 朝のリアル運試しガチャ 〜</p>
        </header>

        <main class="shop-main">
            <div class="real-toy-machine" id="machine">
                <div class="glass-globe-real">
                    <div class="capsule c1"></div>
                    <div class="capsule c2"></div>
                    <div class="capsule c3"></div>
                    <div class="capsule c4"></div>
                    <div class="capsule c5"></div>
                </div>
                
                <div class="machine-body-real">
                    <div class="machine-label-real">1回 100円</div>

                    <div class="mechanism-real">
                        <button class="real-enter-button" id="enterBtn">ENTER</button>
                    </div>
                    
                    <div class="discharge-port-real">
                        <div class="dispensed-capsule-real" id="dispensedCapsule"></div>
                    </div>
                </div>
            </div>

            <div class="open-capsule-stage" id="capsuleStage">
                <div class="split-capsule" id="splitCapsule">
                    <div class="capsule-top" id="capsuleTop"></div>
                    <div class="capsule-bottom" id="capsuleBottom"></div>
                </div>
            </div>

            <div class="result-overlay-real" id="resultOverlay">
                <div class="result-card-real" id="resultCard">
                    <div class="result-header-real">
                        <span class="shop-label-real">小松堂謹製・本日の予言</span>
                        <h2 class="fortune-rank-real" id="fortuneRank">大吉</h2>
                    </div>
                    <div class="result-body-real">
                        <p class="fortune-message-real" id="fortuneMessage">メッセージ</p>
                        
                        <div class="lucky-section-real">
                            <div class="lucky-item-box-real">
                                <span class="lucky-title-real">ラッキーカラー</span>
                                <div class="color-swatch" id="luckyColorSwatch"></div>
                                <p class="lucky-value-real" id="luckyColorName">カラー名</p>
                            </div>
                            <div class="lucky-item-box-real">
                                <span class="lucky-title-real">ラッキーアイテム</span>
                                <p class="lucky-value-real" id="luckyItem">アイテム名</p>
                            </div>
                        </div>

                        <div class="secret-mission-box-real" id="secretMissionBox">
                            <h3 class="mission-title-real">⚠️ 逆転裏ミッション発動 ⚠️</h3>
                            <p class="mission-text-real" id="secretMissionText">ミッション内容</p>
                        </div>
                    </div>
                    <div class="result-footer-real">
                        <button class="close-button-real" id="closeBtn">店を出る</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
